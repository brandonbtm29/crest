# Native macOS arm64 build of CREST (conda-forge gfortran + OpenBLAS, not Apple's Accelerate), packaged as
# a relocatable folder (bin/crest + lib/*.dylib, @rpath, ad-hoc signed), next to a Linux build of the same
# commit; both run the same smoke cases (.github/qb/smoke.py) and compare.py puts them side by side.
# See docs/MACOS.md. This workflow belongs to the brandonbtm29/crest fork (branch qb/macos).

name: qb-macos

on:
  push:
    branches: ['qb/macos']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SMOKE_THREADS: '3'
  XTB_VERSION: '6.7.1'
  PKG: crest-macos-arm64

jobs:
  macos:
    name: macos arm64 (conda-forge gfortran, OpenBLAS)
    runs-on: macos-15
    timeout-minutes: 150
    defaults:
      run:
        shell: bash -el {0}     # login shell: the micromamba environment "build" is active
    env:
      # our objects; the bundled conda-forge dylibs carry their own minimum (printed below)
      MACOSX_DEPLOYMENT_TARGET: '14.0'

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # conda-forge's toolchain, as its crest package uses (gfortran's OpenMP is LLVM's libomp there, and so is
      # OpenBLAS's: one OpenMP runtime per process), but with OpenBLAS instead of Apple's Accelerate.
      # (Homebrew's gcc would bring libgomp while Homebrew's OpenBLAS links libomp: two runtimes.)
      - name: Toolchain (conda-forge compilers, OpenBLAS, LLVM OpenMP)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: build
          create-args: >-
            -c conda-forge
            c-compiler cxx-compiler fortran-compiler cmake ninja
            openblas libopenblas=*=openmp* libblas=*=*openblas liblapack=*=*openblas llvm-openmp
          init-shell: bash

      - name: Toolchain facts
        run: |
          set -e
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          echo "CONDA_BUILD_SYSROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          echo "CC=$CC CXX=$CXX FC=$FC"
          "$FC" --version | head -1
          "$CC" --version | head -1
          micromamba list -n build | grep -E '^\s*(gfortran|libgfortran|clang|llvm-openmp|libopenblas|openblas|libblas|liblapack|cmake) ' || true
          sw_vers
          ls -l "$CONDA_PREFIX"/lib/libopenblas*.dylib "$CONDA_PREFIX"/lib/lib*omp*.dylib
          otool -L "$CONDA_PREFIX/lib/libopenblas.dylib"
          if otool -L "$CONDA_PREFIX/lib/libopenblas.dylib" | grep -q 'libgomp'; then
            echo "::error::OpenBLAS links GCC's libgomp; this build uses LLVM's libomp"; exit 1
          fi

      - name: Configure
        # BLA_VENDOR=OpenBLAS: without it CMake's FindBLAS/FindLAPACK take Apple's Accelerate before a generic
        # libblas, as in conda-forge's osx-arm64 crest 3.0.2, whose optimizer then fails (docs/MACOS.md)
        run: |
          cmake -B _build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/_dist" \
            -DBLA_VENDOR=OpenBLAS \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" \
            -DCMAKE_IGNORE_PREFIX_PATH="/opt/homebrew;/usr/local" \
            -DCMAKE_FIND_FRAMEWORK=NEVER \
            -DCMAKE_EXE_LINKER_FLAGS="${LDFLAGS:-} -Wl,-headerpad_max_install_names" \
            -DWITH_TESTS=ON 2>&1 | tee configure.log
          grep -E 'BLAS|LAPACK|openblas|OpenMP' configure.log || true

      - name: Build
        run: cmake --build _build --parallel 4

      - name: Linked libraries of the build
        run: |
          set -e
          otool -L _build/crest
          if otool -L _build/crest | grep -q 'Accelerate'; then
            echo "::error::crest links Apple Accelerate (legacy f2c BLAS ABI: sdot returns a double)"; exit 1
          fi
          if otool -L _build/crest | grep -q 'libgomp'; then
            echo "::error::crest links libgomp next to OpenBLAS's libomp (two OpenMP runtimes)"; exit 1
          fi

      - name: Unit tests (ctest)
        id: ctest
        continue-on-error: true
        env:
          OMP_NUM_THREADS: 1,2,1
        run: ctest --test-dir _build --output-on-failure --parallel 2 -R '^crest/'

      - name: Package (relocatable folder)
        run: |
          set -e
          pkg="$PWD/$PKG"
          rm -rf "$pkg" && mkdir -p "$pkg/bin"
          strip -o "$pkg/bin/crest" _build/crest
          python3 -I .github/qb/macos_bundle.py "$pkg/bin/crest" "$pkg/lib"
          cp COPYING COPYING.LESSER "$pkg/"
          {
            cat .github/qb/THIRD-PARTY-NOTICES-macos.txt
            echo
            echo "Build"
            echo "-----"
            echo "CREST commit: $(git rev-parse HEAD)"
            echo "Runner: $(sw_vers -productName) $(sw_vers -productVersion) $(uname -m)"
            echo "Compiler: $("$FC" --version | head -1)"
            echo "conda-forge packages:"
            micromamba list -n build | grep -E '^\s*(gfortran_impl|libgfortran|libgcc|llvm-openmp|libopenblas|clang) ' | sed 's/^/  /'
            echo "Bundled libraries (lib/):"
            ls "$pkg/lib" | sed 's/^/  /'
            echo "Minimum macOS of each file (LC_BUILD_VERSION minos):"
            for f in "$pkg/bin/crest" "$pkg"/lib/*.dylib; do
              echo "  $(basename "$f"): $(otool -l "$f" | awk '/LC_BUILD_VERSION/ {b=1} b && /minos/ {print $2; exit}')"
            done
            echo
            git submodule status --recursive
          } > "$pkg/THIRD-PARTY-NOTICES.txt"
          tar -C "$PWD" -czf "$PKG.tar.gz" "$PKG"
          shasum -a 256 "$PKG.tar.gz" | tee "$PKG.tar.gz.sha256"
          ls -l "$pkg" "$pkg/bin" "$pkg/lib"

      - name: The package runs from another folder, outside the build environment
        run: |
          set -e
          micromamba deactivate || true
          dest="$RUNNER_TEMP/unpacked"
          rm -rf "$dest" && mkdir -p "$dest"
          tar -C "$dest" -xzf "$PKG.tar.gz"
          exe="$dest/$PKG/bin/crest"
          codesign --verify --verbose=2 "$exe"
          DYLD_PRINT_LIBRARIES=1 "$exe" --version > version.txt 2> dyld.txt
          head -20 version.txt
          # loaded images are the "dyld[pid]: <UUID> /path" lines (macOS 15 also prints "move loaded to delayed")
          grep -E '^dyld\[[0-9]+\]: <[^>]*> /' dyld.txt | sed 's/^dyld\[[0-9]*\]: <[^>]*> //' \
            | grep -v '^/usr/lib/\|^/System/' | sort -u | tee loaded.txt
          [ -s loaded.txt ] || { echo "::error::no library loads seen in DYLD_PRINT_LIBRARIES output"; exit 1; }
          if grep -v "^$dest/$PKG/" loaded.txt | grep -q .; then
            echo "::error::crest loaded a library from outside its folder:"; grep -v "^$dest/$PKG/" loaded.txt; exit 1
          fi
          echo "CREST_EXE=$exe" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: xtb program for the legacy-mode case (conda-forge, optional)
        continue-on-error: true
        run: micromamba create -y -n xtb -c conda-forge "xtb=$XTB_VERSION"

      - name: Smoke runs (from the unpacked folder, outside the build environment)
        run: |
          micromamba deactivate || true
          ulimit -s unlimited 2>/dev/null || ulimit -s "$(ulimit -Hs)" || true
          extra=()
          xtb_bin="${MAMBA_ROOT_PREFIX:-}/envs/xtb/bin"
          if [ -x "$xtb_bin/xtb" ]; then
            export PATH="$xtb_bin:$PATH" XTBPATH="${MAMBA_ROOT_PREFIX}/envs/xtb/share/xtb"
            extra=(--legacy-cases)
          fi
          python -I .github/qb/smoke.py "$CREST_EXE" "$RUNNER_TEMP/smoke" --threads "$SMOKE_THREADS" \
            --json "$RUNNER_TEMP/smoke/smoke-macos.json" "${extra[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PKG }}
          path: |
            ${{ env.PKG }}.tar.gz
            ${{ env.PKG }}.tar.gz.sha256
          retention-days: 30

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-macos
          path: |
            ${{ runner.temp }}/smoke/*.json
            ${{ runner.temp }}/smoke/*/crest.out
          retention-days: 30

  linux:
    name: linux (gcc/gfortran, OpenBLAS)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libopenblas-dev cmake ninja-build
          gfortran --version | head -1

      - name: Configure and build
        run: |
          cmake -B _build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/_dist" \
            -DBLA_VENDOR=OpenBLAS -DWITH_TESTS=OFF
          cmake --build _build --parallel 4
          cmake --install _build

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: xtb program for the legacy-mode case (optional)
        continue-on-error: true
        run: |
          curl -sSfL -o "$RUNNER_TEMP/xtb.tar.xz" \
            "https://github.com/grimme-lab/xtb/releases/download/v$XTB_VERSION/xtb-$XTB_VERSION-linux-x86_64.tar.xz"
          mkdir -p "$RUNNER_TEMP/xtb" && tar xf "$RUNNER_TEMP/xtb.tar.xz" -C "$RUNNER_TEMP/xtb"
          bin=$(dirname "$(find "$RUNNER_TEMP/xtb" -type f -name xtb | head -1)")
          "$bin/xtb" --version | grep -i version
          echo "XTB_BIN=$bin" >> "$GITHUB_ENV"
          echo "XTBPATH=$(dirname "$bin")/share/xtb" >> "$GITHUB_ENV"

      - name: Smoke runs
        run: |
          ulimit -s unlimited || true
          extra=()
          if [ -n "$XTB_BIN" ]; then export PATH="$XTB_BIN:$PATH"; extra=(--legacy-cases); fi
          python -I .github/qb/smoke.py "$PWD/_dist/bin/crest" "$RUNNER_TEMP/smoke" --threads "$SMOKE_THREADS" \
            --json "$RUNNER_TEMP/smoke/smoke-linux.json" "${extra[@]}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-linux
          path: |
            ${{ runner.temp }}/smoke/*.json
            ${{ runner.temp }}/smoke/*/crest.out
          retention-days: 30

  compare:
    name: compare macOS with Linux
    needs: [macos, linux]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/qb

      - uses: actions/download-artifact@v8
        with:
          pattern: smoke-*
          path: smoke

      - name: Compare
        run: |
          ls -R smoke | head -50
          f=smoke/smoke-macos/smoke-macos.json
          [ -f "$f" ] || { echo "no $f"; exit 1; }
          echo "## macOS arm64 vs Linux" >> "$GITHUB_STEP_SUMMARY"
          rc=0
          python3 -I .github/qb/compare.py smoke/smoke-linux/smoke-linux.json "$f" --md cmp-macos.md || rc=1
          cat cmp-macos.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc
